<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados y Jornadas - A Ras de Calle</title>
    <style>
        :root {
            --bg-dark: #0f1713;
            --card-bg: #18241e;
            --card-hover: #1f2e26;
            --primary-green: #1e824c;
            --accent-gold: #d4af37;
            --text-main: #f4f6f5;
            --text-muted: #9eb3a8;
            --border-color: #2a3d33;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.4;
            padding-bottom: 40px;
        }

        /* Cabecera */
        header {
            background: linear-gradient(135deg, #0b120e 0%, #163022 100%);
            border-bottom: 2px solid var(--accent-gold);
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-title span {
            color: var(--accent-gold);
        }

        .btn-back {
            background-color: rgba(212, 175, 55, 0.15);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
        }

        /* Contenedor Principal */
        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Selector de Categoría */
        .filter-box {
            background-color: var(--card-bg);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .filter-box label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-gold);
            margin-bottom: 8px;
            font-weight: 700;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background-color: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--primary-green);
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
        }

        /* Navegación de Jornadas */
        .jornada-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .btn-nav {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-nav:disabled {
            background-color: #2a3d33;
            color: #6b8075;
            cursor: not-allowed;
        }

        .jornada-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        /* Lista de Partidos */
        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .match-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 12px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
        }

        .match-card.descansa {
            opacity: 0.7;
            background-color: rgba(24, 36, 30, 0.5);
            border-style: dashed;
        }

        .team {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-word;
        }

        .team.local {
            text-align: right;
        }

        .team.visitante {
            text-align: left;
        }

        .team.winner {
            color: #ffffff;
            font-weight: 800;
        }

        .score-box {
            background-color: var(--bg-dark);
            border: 1px solid var(--primary-green);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1rem;
            color: var(--accent-gold);
            min-width: 68px;
            text-align: center;
            letter-spacing: 1px;
        }

        .score-box.pending {
            border-color: var(--border-color);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-tag {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
    </style>
</head>

        // =========================================================================
        // LÓGICA DE NAVEGACIÓN Y RENDERIZADO
        // =========================================================================
        let categoriaActual = "2and_g1";
        let jornadaActual = 1;

        const selectCategoria = document.getElementById("categoriaSelect");
        const matchesContainer = document.getElementById("matchesContainer");
        const jornadaLabel = document.getElementById("jornadaLabel");
        const btnPrev = document.getElementById("btnPrev");
        const btnNext = document.getElementById("btnNext");

        // Detectar última jornada disponible de una categoría para mostrarla por defecto
        function obtenerUltimaJornada(cat) {
            if (!DATOS_LIGA[cat]) return 1;
            const jornadas = Object.keys(DATOS_LIGA[cat]).map(Number);
            return jornadas.length > 0 ? Math.max(...jornadas) : 1;
        }

        function renderizarPartidos() {
            const datosCat = DATOS_LIGA[categoriaActual] || {};
            const jornadasDisponibles = Object.keys(datosCat).map(Number).sort((a, b) => a - b);
            const maxJornada = jornadasDisponibles.length > 0 ? Math.max(...jornadasDisponibles) : 1;
            const minJornada = jornadasDisponibles.length > 0 ? Math.min(...jornadasDisponibles) : 1;

            jornadaLabel.textContent = `Jornada ${jornadaActual}`;
            btnPrev.disabled = jornadaActual <= minJornada;
            btnNext.disabled = jornadaActual >= maxJornada;

            const partidos = datosCat[jornadaActual] || [];
            matchesContainer.innerHTML = "";

            if (partidos.length === 0) {
                matchesContainer.innerHTML = `<div class="match-card"><div class="status-tag">No hay partidos registrados para esta jornada.</div></div>`;
                return;
            }

            partidos.forEach(p => {
                const card = document.createElement("div");
                const esDescanso = p.local === "DESCANSA" || p.visitante === "-" || p.res === "DESCANSA";
                card.className = esDescanso ? "match-card descansa" : "match-card";

                let localClass = "team local";
                let visitClass = "team visitante";
                let scoreClass = "score-box";

                if (p.res.includes("-")) {
                    const partes = p.res.split("-").map(Number);
                    if (!isNaN(partes[0]) && !isNaN(partes[1])) {
                        if (partes[0] > partes[1]) localClass += " winner";
                        else if (partes[1] > partes[0]) visitClass += " winner";
                    }
                } else {
                    scoreClass += " pending";
                }

                card.innerHTML = `
                    <div class="${localClass}">${p.local}</div>
                    <div class="${scoreClass}">${p.res}</div>
                    <div class="${visitClass}">${p.visitante}</div>
                `;
                matchesContainer.appendChild(card);
            });
        }

        function cambiarJornada(delta) {
            jornadaActual += delta;
            renderizarPartidos();
        }

        selectCategoria.addEventListener("change", (e) => {
            categoriaActual = e.target.value;
            jornadaActual = obtenerUltimaJornada(categoriaActual);
            renderizarPartidos();
        });

        // Inicializar en la última jornada de la primera categoría
        jornadaActual = obtenerUltimaJornada(categoriaActual);
        renderizarPartidos();
    </script>
