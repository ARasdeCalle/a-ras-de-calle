<html lang="es">
<head>

    <title>Resultados y Jornadas - A Ras de Calle</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-hover: #2a2a2a;
            --accent-gold: #fbc02d;
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.4;
            padding-bottom: 40px;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--accent-gold);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-title {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo-title span {
            color: var(--accent-gold);
        }

        .nav-links {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .nav-link-item {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .nav-link-item:hover {
            border-color: var(--accent-gold);
        }

        .nav-link-item.active {
            background-color: var(--accent-gold);
            color: #121212;
            border-color: var(--accent-gold);
            font-weight: 700;
        }

        .container {
            max-width: 760px;
            margin: 16px auto;
            padding: 0 16px;
        }

        .filter-box {
            background-color: var(--card-bg);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .filter-box label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-gold);
            margin-bottom: 8px;
            font-weight: 700;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
        }

        select:focus {
            border-color: var(--accent-gold);
        }

        .jornada-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .btn-nav {
            background-color: var(--accent-gold);
            color: #121212;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-nav:disabled {
            background-color: #222;
            color: #555;
            cursor: not-allowed;
        }

        .jornada-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .match-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 12px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
        }

        .match-card.descansa {
            opacity: 0.6;
            background-color: rgba(30, 30, 30, 0.4);
            border-style: dashed;
        }

        .team {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-word;
        }

        .team.local {
            text-align: right;
        }

        .team.visitante {
            text-align: left;
        }

        .team.winner {
            color: #ffffff;
            font-weight: 800;
        }

        .score-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1rem;
            color: var(--accent-gold);
            min-width: 76px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .score-box.pending {
            border-color: var(--border-color);
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 700;
        }

        .score-box.suspended {
            background-color: rgba(211, 47, 47, 0.15);
            border-color: #d32f2f;
            color: #ff5252;
            font-size: 0.68rem;
            font-weight: 700;
        }

        .score-box.postponed {
            background-color: rgba(251, 192, 45, 0.15);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            font-size: 0.68rem;
            font-weight: 700;
        }

        .score-box.rest {
            background-color: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>

        let categoriaActual = "tercera_rfef";
        let jornadaActual = 1;

        const selectCategoria = document.getElementById("categoriaSelect");
        const matchesContainer = document.getElementById("matchesContainer");
        const jornadaLabel = document.getElementById("jornadaLabel");
        const btnPrev = document.getElementById("btnPrev");
        const btnNext = document.getElementById("btnNext");

        function obtenerUltimaJornada(cat) {
            if (!DATOS_LIGA[cat]) return 1;
            const jornadas = Object.keys(DATOS_LIGA[cat]).map(Number);
            return jornadas.length > 0 ? Math.max(...jornadas) : 1;
        }

        function renderizarPartidos() {
            const datosCat = DATOS_LIGA[categoriaActual] || {};
            const jornadasDisponibles = Object.keys(datosCat).map(Number).sort((a, b) => a - b);
            const maxJornada = jornadasDisponibles.length > 0 ? Math.max(...jornadasDisponibles) : 1;
            const minJornada = jornadasDisponibles.length > 0 ? Math.min(...jornadasDisponibles) : 1;

            jornadaLabel.textContent = `Jornada ${jornadaActual}`;
            btnPrev.disabled = jornadaActual <= minJornada;
            btnNext.disabled = jornadaActual >= maxJornada;

            const partidos = datosCat[jornadaActual] || [];
            matchesContainer.innerHTML = "";

            if (partidos.length === 0) {
                matchesContainer.innerHTML = `<div class="match-card"><div class="status-tag">No hay partidos registrados para esta jornada.</div></div>`;
                return;
            }

            partidos.forEach(p => {
                const card = document.createElement("div");
                const esDescanso = p.local === "DESCANSA" || p.visitante === "-" || p.res === "DESCANSA";
                card.className = esDescanso ? "match-card descansa" : "match-card";

                let localClass = "team local";
                let visitClass = "team visitante";
                let scoreClass = "score-box";
                let textoRes = p.res;

                if (esDescanso) {
                    scoreClass += " rest";
                } else if (textoRes === "SUSP." || textoRes === "Susp.") {
                    scoreClass += " suspended";
                    textoRes = "SUSPENDIDO";
                } else if (textoRes === "Aplaz." || textoRes === "APLAZ.") {
                    scoreClass += " postponed";
                    textoRes = "APLAZADO";
                } else if (textoRes.includes("-")) {
                    const partes = textoRes.split("-").map(Number);
                    if (!isNaN(partes[0]) && !isNaN(partes[1])) {
                        if (partes[0] > partes[1]) localClass += " winner";
                        else if (partes[1] > partes[0]) visitClass += " winner";
                    }
                } else {
                    scoreClass += " pending";
                }

                card.innerHTML = `
                    <div class="${localClass}">${p.local}</div>
                    <div class="${scoreClass}">${textoRes}</div>
                    <div class="${visitClass}">${p.visitante}</div>
                `;
                matchesContainer.appendChild(card);
            });
        }

        function cambiarJornada(delta) {
            jornadaActual += delta;
            renderizarPartidos();
        }

        selectCategoria.addEventListener("change", (e) => {
            categoriaActual = e.target.value;
            jornadaActual = obtenerUltimaJornada(categoriaActual);
            renderizarPartidos();
        });

        jornadaActual = obtenerUltimaJornada(categoriaActual);
        renderizarPartidos();
