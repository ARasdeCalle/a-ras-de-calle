<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Ras de Calle — Equipos de Sevilla</title>
  <style>
    :root {
      --bg-page: #061324;
      --bg-header: #051120;
      --bg-card: #0c213d;
      --bg-card-hover: #10294b;
      --bg-input: #07162b;
      --border-subtle: rgba(148, 178, 214, 0.14);
      --border-gold: #c99214;
      --accent-gold: #dfa215;
      --accent-gold-hover: #ebb024;
      --text-main: #f3f6fa;
      --text-muted: #8fa4bf;
      --text-gold: #e0a419;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.45;
      min-height: 100vh;
      padding-bottom: 56px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Cabecera y navegación */
    .site-header {
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-gold);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1380px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-badge {
      background-color: var(--accent-gold);
      color: #071324;
      font-weight: 900;
      font-size: 0.78rem;
      padding: 3px 7px;
      border-radius: 4px;
      line-height: 1.1;
    }

    .nav-list {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      list-style: none;
    }

    .nav-link {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #d6e2f0;
      border: 1px solid rgba(148, 178, 214, 0.16);
      background-color: rgba(12, 33, 61, 0.45);
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .nav-link:hover {
      background-color: var(--bg-card-hover);
      border-color: rgba(223, 162, 21, 0.45);
      color: #ffffff;
    }

    .nav-link.active {
      background-color: var(--accent-gold);
      color: #071324;
      border-color: var(--accent-gold);
      font-weight: 700;
    }

    /* Contenedor principal */
    .main-container {
      max-width: 1020px;
      margin: 0 auto;
      padding: 28px 20px 64px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .filter-panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 20px 22px;
    }

    .panel-kicker {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-gold);
      margin-bottom: 6px;
    }

    .panel-title {
      color: var(--text-main);
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .selectors-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    select,
    input[type="text"] {
      width: 100%;
      background-color: var(--bg-input);
      color: var(--text-main);
      border: 1px solid rgba(148, 178, 214, 0.2);
      padding: 10px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    select:focus,
    input[type="text"]:focus {
      border-color: var(--accent-gold);
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    .search-box {
      margin-top: 12px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .results-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .results-heading::before {
      content: "";
      width: 3px;
      height: 16px;
      background-color: var(--accent-gold);
      border-radius: 2px;
      display: inline-block;
    }

    .team-count {
      background-color: rgba(223, 162, 21, 0.14);
      color: var(--text-gold);
      border: 1px solid rgba(223, 162, 21, 0.4);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .team-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.15s ease;
    }

    .team-card:hover {
      background-color: var(--bg-card-hover);
      border-color: rgba(223, 162, 21, 0.45);
      transform: translateY(-1px);
    }

    .team-shield {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background-color: rgba(223, 162, 21, 0.12);
      border: 1px solid rgba(223, 162, 21, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.78rem;
      color: var(--text-gold);
      flex-shrink: 0;
    }

    .team-info {
      overflow: hidden;
    }

    .team-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-meta {
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 28px 16px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      grid-column: 1 / -1;
      font-size: 0.88rem;
    }

    @media (max-width: 820px) {
      .teams-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .header-inner {
        padding: 12px 14px;
        gap: 12px;
      }

      .main-container {
        padding: 20px 14px 48px;
      }

      .selectors-grid,
      .teams-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

      <div class="selectors-grid">

        </div>
        <div class="field-group">

    const categorySelect = document.getElementById('categorySelect');
    const groupSelect = document.getElementById('groupSelect');
    const searchInput = document.getElementById('searchInput');
    const teamsGrid = document.getElementById('teamsGrid');
    const currentHeading = document.getElementById('currentHeading');
    const teamCount = document.getElementById('teamCount');

    function getInitials(name) {
      const clean = name.replace(/C\.F\.?|U\.D\.?|C\.D\.?|A\.D\.?|S\.A\.D\.?|F\.C\.?|U\.B\.?|U\.P\.?|P\.D\.?|C\.A\.D\.?|C\.M\.D\.?|F\.S\.?|F\.B\.?/gi, '').trim();
      const parts = clean.split(/\s+/);
      if (parts.length >= 2) {
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }
      return clean.substring(0, 2).toUpperCase() || 'FC';
    }

    function populateCategories() {
      const categories = Object.keys(clubsData);
      categorySelect.innerHTML = '';
      categories.forEach(function(cat) {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });
      populateGroups();
    }

    function populateGroups() {
      const selectedCat = categorySelect.value;
      const groups = Object.keys(clubsData[selectedCat]);
      groupSelect.innerHTML = '';
      groups.forEach(function(grp) {
        const option = document.createElement('option');
        option.value = grp;
        option.textContent = grp;
        groupSelect.appendChild(option);
      });
      renderTeams();
    }

    function renderTeams() {
      const selectedCat = categorySelect.value;
      const selectedGrp = groupSelect.value;
      const query = searchInput.value.trim().toLowerCase();

      const rawTeams = clubsData[selectedCat][selectedGrp] || [];
      const filteredTeams = rawTeams.filter(function(team) {
        return team.toLowerCase().includes(query);
      });

      currentHeading.textContent = selectedCat + ' · ' + selectedGrp;
      teamCount.textContent = filteredTeams.length + (filteredTeams.length === 1 ? ' club' : ' clubes');

      teamsGrid.innerHTML = '';

      if (filteredTeams.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-msg';
        empty.textContent = 'No se encontraron equipos con ese nombre en esta categoría.';
        teamsGrid.appendChild(empty);
        return;
      }

      filteredTeams.forEach(function(teamName) {
        const card = document.createElement('div');
        card.className = 'team-card';

        const shield = document.createElement('div');
        shield.className = 'team-shield';
        shield.textContent = getInitials(teamName);

        const info = document.createElement('div');
        info.className = 'team-info';

        const title = document.createElement('h3');
        title.className = 'team-name';
        title.textContent = teamName;

        const meta = document.createElement('p');
        meta.className = 'team-meta';
        meta.textContent = selectedCat + ' (' + selectedGrp + ')';

        info.appendChild(title);
        info.appendChild(meta);
        card.appendChild(shield);
        card.appendChild(info);

        teamsGrid.appendChild(card);
      });
    }

    categorySelect.addEventListener('change', function() {
      searchInput.value = '';
      populateGroups();
    });

    groupSelect.addEventListener('change', function() {
      searchInput.value = '';
      renderTeams();
    });

    searchInput.addEventListener('input', renderTeams);

    populateCategories();
  </script>
