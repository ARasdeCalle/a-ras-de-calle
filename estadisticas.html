<!DOCTYPE html>
<html lang="es">
<head>

    <title>A Ras de Calle - Clasificaciones</title>

    <style>
        :root {
            --bg-dark: #0b1f3b;
            --bg-card: #132a4a;
            --gold: #d4af37;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #071324;
            color: var(--text-light);
        }

        .mobile-header {
            background: var(--bg-dark);
            border-bottom: 2px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0.75rem 1rem;
        }

        .brand-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            background: var(--gold);
            color: var(--bg-dark);
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
        }

        .nav-scroll {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-top: 0.75rem;
            padding-bottom: 0.25rem;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .nav-scroll::-webkit-scrollbar { display: none; }

        .nav-pill {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-light);
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .nav-pill.active {
            background: var(--gold);
            color: var(--bg-dark);
            border-color: var(--gold);
        }

        .container {
            padding: 1rem;
            max-width: 950px;
            margin: 0 auto;
        }

        .filter-panel {
            background: var(--bg-card);
            padding: 1.25rem;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 1.25rem;
        }

        .panel-title {
            color: var(--gold);
            font-size: 1rem;
            font-weight: 800;
            margin: 0 0 1rem 0;
        }

        .selectors-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        @media (min-width: 600px) {
            .selectors-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .field-group label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            font-weight: 600;
        }

        select {
            width: 100%;
            background: var(--bg-dark);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 10px 12px;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .table-container {
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        th {
            background: var(--bg-dark);
            color: var(--gold);
            padding: 10px 8px;
            font-weight: 700;
            font-size: 0.78rem;
            text-transform: uppercase;
            border-bottom: 2px solid var(--gold);
        }

        td {
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }

        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .font-bold { font-weight: 700; }
        .gold-text { color: var(--gold); }

        .table-header-title {
            padding: 1rem;
            font-size: 1rem;
            font-weight: 800;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-badge {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
        }
    </style>
</head>

        const categorySelect = document.getElementById('categorySelect');
        const groupSelect = document.getElementById('groupSelect');
        const standingsBody = document.getElementById('standingsBody');
        const tableTitle = document.getElementById('tableTitle');
        const tableJornada = document.getElementById('tableJornada');

        function populateCategories() {
            const categories = Object.keys(standingsData);
            categorySelect.innerHTML = '';
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                categorySelect.appendChild(option);
            });
            populateGroups();
        }

        function populateGroups() {
            const selectedCat = categorySelect.value;
            const groups = Object.keys(standingsData[selectedCat]);
            groupSelect.innerHTML = '';
            groups.forEach(grp => {
                const option = document.createElement('option');
                option.value = grp;
                option.textContent = grp;
                groupSelect.appendChild(option);
            });
            renderTable();
        }

        function renderTable() {
            const selectedCat = categorySelect.value;
            const selectedGrp = groupSelect.value;
            const rows = standingsData[selectedCat][selectedGrp] || [];

            tableTitle.textContent = selectedCat + ' (' + selectedGrp + ')';
            tableJornada.textContent = 'Actualizado 17 Nov 2026';

            standingsBody.innerHTML = '';

            if (rows.length === 0) {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 7;
                td.className = 'text-center';
                td.style.padding = '2rem';
                td.textContent = 'No hay datos de clasificación disponibles para este grupo.';
                tr.appendChild(td);
                standingsBody.appendChild(tr);
                return;
            }

            rows.forEach(team => {
                const tr = document.createElement('tr');

                // Posición
                const tdPos = document.createElement('td');
                tdPos.className = 'text-center font-bold gold-text';
                tdPos.textContent = team.pos;

                // Nombre
                const tdName = document.createElement('td');
                tdName.className = 'font-bold';
                tdName.textContent = team.name;

                // Puntos
                const tdPts = document.createElement('td');
                tdPts.className = 'text-center font-bold gold-text';
                tdPts.textContent = team.pts;

                // Jugados
                const tdJ = document.createElement('td');
                tdJ.className = 'text-center';
                tdJ.textContent = team.j;

                // Ganados
                const tdG = document.createElement('td');
                tdG.className = 'text-center';
                tdG.textContent = team.g;

                // Empatados
                const tdE = document.createElement('td');
                tdE.className = 'text-center';
                tdE.textContent = team.e;

                // Perdidos
                const tdP = document.createElement('td');
                tdP.className = 'text-center';
                tdP.textContent = team.p;

                tr.appendChild(tdPos);
                tr.appendChild(tdName);
                tr.appendChild(tdPts);
                tr.appendChild(tdJ);
                tr.appendChild(tdG);
                tr.appendChild(tdE);
                tr.appendChild(tdP);

                standingsBody.appendChild(tr);
            });
        }

        categorySelect.addEventListener('change', populateGroups);
        groupSelect.addEventListener('change', renderTable);

        populateCategories();
