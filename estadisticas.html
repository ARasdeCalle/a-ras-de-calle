<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Ras de Calle — Clasificaciones</title>
  <style>
    :root {
      --bg-page: #061324;
      --bg-header: #051120;
      --bg-card: #0c213d;
      --bg-card-hover: #10294b;
      --bg-input: #07162b;
      --border-subtle: rgba(148, 178, 214, 0.14);
      --border-gold: #c99214;
      --accent-gold: #dfa215;
      --accent-gold-hover: #ebb024;
      --text-main: #f3f6fa;
      --text-muted: #8fa4bf;
      --text-gold: #e0a419;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.45;
      min-height: 100vh;
      padding-bottom: 56px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Cabecera y navegación */
    .site-header {
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-gold);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1380px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-badge {
      background-color: var(--accent-gold);
      color: #071324;
      font-weight: 900;
      font-size: 0.78rem;
      padding: 3px 7px;
      border-radius: 4px;
      line-height: 1.1;
    }

    .nav-list {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      list-style: none;
    }

    .nav-link {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #d6e2f0;
      border: 1px solid rgba(148, 178, 214, 0.16);
      background-color: rgba(12, 33, 61, 0.45);
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .nav-link:hover {
      background-color: var(--bg-card-hover);
      border-color: rgba(223, 162, 21, 0.45);
      color: #ffffff;
    }

    .nav-link.active {
      background-color: var(--accent-gold);
      color: #071324;
      border-color: var(--accent-gold);
      font-weight: 700;
    }

    /* Contenedor principal */
    .main-container {
      max-width: 1020px;
      margin: 0 auto;
      padding: 28px 20px 64px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .filter-panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 20px 22px;
    }

    .panel-kicker {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-gold);
      margin-bottom: 6px;
    }

    .panel-title {
      color: var(--text-main);
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .selectors-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      background-color: var(--bg-input);
      color: var(--text-main);
      border: 1px solid rgba(148, 178, 214, 0.2);
      padding: 10px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.15s ease;
    }

    select:focus {
      border-color: var(--accent-gold);
    }

    .table-container {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .table-header-title {
      padding: 14px 18px;
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .table-badge {
      background-color: rgba(223, 162, 21, 0.14);
      color: var(--text-gold);
      border: 1px solid rgba(223, 162, 21, 0.4);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
      white-space: nowrap;
    }

    th {
      background-color: var(--bg-header);
      color: var(--text-gold);
      padding: 11px 10px;
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border-gold);
    }

    td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--border-subtle);
      color: #dce6f2;
    }

    tr:hover td {
      background-color: var(--bg-card-hover);
    }

    .text-center {
      text-align: center;
    }

    .font-bold {
      font-weight: 700;
      color: #ffffff;
    }

    .gold-text {
      color: var(--text-gold);
    }

    @media (max-width: 700px) {
      .header-inner {
        padding: 12px 14px;
        gap: 12px;
      }

      .main-container {
        padding: 20px 14px 48px;
      }

      .selectors-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    const categorySelect = document.getElementById('categorySelect');
    const groupSelect = document.getElementById('groupSelect');
    const standingsBody = document.getElementById('standingsBody');
    const tableTitle = document.getElementById('tableTitle');
    const tableJornada = document.getElementById('tableJornada');

    function populateCategories() {
      const categories = Object.keys(standingsData);
      categorySelect.innerHTML = '';
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });
      populateGroups();
    }

    function populateGroups() {
      const selectedCat = categorySelect.value;
      const groups = Object.keys(standingsData[selectedCat]);
      groupSelect.innerHTML = '';
      groups.forEach(grp => {
        const option = document.createElement('option');
        option.value = grp;
        option.textContent = grp;
        groupSelect.appendChild(option);
      });
      renderTable();
    }

    function renderTable() {
      const selectedCat = categorySelect.value;
      const selectedGrp = groupSelect.value;
      const rows = standingsData[selectedCat][selectedGrp] || [];

      tableTitle.textContent = selectedCat + ' (' + selectedGrp + ')';
      tableJornada.textContent = 'Actualizado 17 Nov 2026';

      standingsBody.innerHTML = '';

      if (rows.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 7;
        td.className = 'text-center';
        td.style.padding = '2rem';
        td.textContent = 'No hay datos de clasificación disponibles para este grupo.';
        tr.appendChild(td);
        standingsBody.appendChild(tr);
        return;
      }

      rows.forEach(team => {
        const tr = document.createElement('tr');

        const tdPos = document.createElement('td');
        tdPos.className = 'text-center font-bold gold-text';
        tdPos.textContent = team.pos;

        const tdName = document.createElement('td');
        tdName.className = 'font-bold';
        tdName.textContent = team.name;

        const tdPts = document.createElement('td');
        tdPts.className = 'text-center font-bold gold-text';
        tdPts.textContent = team.pts;

        const tdJ = document.createElement('td');
        tdJ.className = 'text-center';
        tdJ.textContent = team.j;

        const tdG = document.createElement('td');
        tdG.className = 'text-center';
        tdG.textContent = team.g;

        const tdE = document.createElement('td');
        tdE.className = 'text-center';
        tdE.textContent = team.e;

        const tdP = document.createElement('td');
        tdP.className = 'text-center';
        tdP.textContent = team.p;

        tr.appendChild(tdPos);
        tr.appendChild(tdName);
        tr.appendChild(tdPts);
        tr.appendChild(tdJ);
        tr.appendChild(tdG);
        tr.appendChild(tdE);
        tr.appendChild(tdP);

        standingsBody.appendChild(tr);
      });
    }

    categorySelect.addEventListener('change', populateGroups);
    groupSelect.addEventListener('change', renderTable);

    populateCategories();
  </script>
