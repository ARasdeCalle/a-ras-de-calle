<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --bg-dark: #0b1f3b;
            --bg-card: #132a4a;
            --gold: #d4af37;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #071324;
            color: var(--text-light);
        }

        .mobile-header {
            background: var(--bg-dark);
            border-bottom: 2px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0.75rem 1rem;
        }

        .brand-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            background: var(--gold);
            color: var(--bg-dark);
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
        }

        .nav-scroll {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-top: 0.75rem;
            padding-bottom: 0.25rem;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .nav-scroll::-webkit-scrollbar { display: none; }

        .nav-pill {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-light);
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .nav-pill.active {
            background: var(--gold);
            color: var(--bg-dark);
            border-color: var(--gold);
        }

        .container {
            padding: 1rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .filter-panel {
            background: var(--bg-card);
            padding: 1.25rem;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 1.25rem;
        }

        .panel-title {
            color: var(--gold);
            font-size: 1rem;
            font-weight: 800;
            margin: 0 0 1rem 0;
        }

        .selectors-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        @media (min-width: 600px) {
            .selectors-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .field-group label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            font-weight: 600;
        }

        select, input[type="text"] {
            width: 100%;
            background: var(--bg-dark);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 10px 12px;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .search-box {
            margin-top: 0.75rem;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .results-heading {
            font-size: 1.05rem;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
        }

        .team-count {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .teams-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        @media (min-width: 550px) {
            .teams-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 820px) {
            .teams-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .team-card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 0.9rem 1rem;
            border-left: 4px solid var(--gold);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.15s ease;
        }

        .team-card:hover {
            transform: translateY(-2px);
        }

        .team-shield {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--bg-dark);
            border: 1px solid rgba(212, 175, 55, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
            color: var(--gold);
            flex-shrink: 0;
        }

        .team-info {
            overflow: hidden;
        }

        .team-name {
            font-size: 0.92rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 0.2rem 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .team-meta {
            font-size: 0.74rem;
            color: var(--text-muted);
            margin: 0;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem 1rem;
            background: var(--bg-card);
            border-radius: 8px;
        }
    </style>
</head>

        const categorySelect = document.getElementById('categorySelect');
        const groupSelect = document.getElementById('groupSelect');
        const searchInput = document.getElementById('searchInput');
        const teamsGrid = document.getElementById('teamsGrid');
        const currentHeading = document.getElementById('currentHeading');
        const teamCount = document.getElementById('teamCount');

        function getInitials(name) {
            const clean = name.replace(/C\.F\.?|U\.D\.?|C\.D\.?|A\.D\.?|S\.A\.D\.?|F\.C\.?|U\.B\.?|U\.P\.?|P\.D\.?|C\.A\.D\.?|C\.M\.D\.?|F\.S\.?|F\.B\.?/gi, '').trim();
            const parts = clean.split(/\s+/);
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return clean.substring(0, 2).toUpperCase() || 'FC';
        }

        function populateCategories() {
            const categories = Object.keys(clubsData);
            categorySelect.innerHTML = '';
            categories.forEach(function(cat) {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                categorySelect.appendChild(option);
            });
            populateGroups();
        }

        function populateGroups() {
            const selectedCat = categorySelect.value;
            const groups = Object.keys(clubsData[selectedCat]);
            groupSelect.innerHTML = '';
            groups.forEach(function(grp) {
                const option = document.createElement('option');
                option.value = grp;
                option.textContent = grp;
                groupSelect.appendChild(option);
            });
            renderTeams();
        }

        function renderTeams() {
            const selectedCat = categorySelect.value;
            const selectedGrp = groupSelect.value;
            const query = searchInput.value.trim().toLowerCase();

            const rawTeams = clubsData[selectedCat][selectedGrp] || [];
            const filteredTeams = rawTeams.filter(function(team) {
                return team.toLowerCase().includes(query);
            });

            currentHeading.textContent = selectedCat + ' · ' + selectedGrp;
            teamCount.textContent = filteredTeams.length + (filteredTeams.length === 1 ? ' club' : ' clubes');

            teamsGrid.innerHTML = '';

            if (filteredTeams.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-msg';
                empty.textContent = 'No se encontraron equipos con ese nombre en esta categoría.';
                teamsGrid.appendChild(empty);
                return;
            }

            filteredTeams.forEach(function(teamName) {
                const card = document.createElement('div');
                card.className = 'team-card';

                const shield = document.createElement('div');
                shield.className = 'team-shield';
                shield.textContent = getInitials(teamName);

                const info = document.createElement('div');
                info.className = 'team-info';

                const title = document.createElement('h4');
                title.className = 'team-name';
                title.textContent = teamName;

                const meta = document.createElement('p');
                meta.className = 'team-meta';
                meta.textContent = selectedCat + ' (' + selectedGrp + ')';

                info.appendChild(title);
                info.appendChild(meta);
                card.appendChild(shield);
                card.appendChild(info);

                teamsGrid.appendChild(card);
            });
        }

        categorySelect.addEventListener('change', function() {
            searchInput.value = '';
            populateGroups();
        });

        groupSelect.addEventListener('change', function() {
            searchInput.value = '';
            renderTeams();
        });

        searchInput.addEventListener('input', renderTeams);

        populateCategories();
    </script>
