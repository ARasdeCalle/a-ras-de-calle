<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Ras de Calle - Foro</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --bg-dark: #0b1f3b;
            --bg-card: #132a4a;
            --gold: #d4af37;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #071324;
            color: var(--text-light);
        }

        .mobile-header {
            background: var(--bg-dark);
            border-bottom: 2px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0.75rem 1rem;
        }

        .brand-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            background: var(--gold);
            color: var(--bg-dark);
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
        }

        .nav-scroll {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-top: 0.75rem;
            padding-bottom: 0.25rem;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .nav-scroll::-webkit-scrollbar { display: none; }

        .nav-pill {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-light);
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .nav-pill.active {
            background: var(--gold);
            color: var(--bg-dark);
            border-color: var(--gold);
        }

        .container {
            padding: 1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .forum-form {
            background: var(--bg-card);
            padding: 1.25rem;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 1.5rem;
        }

        .form-title {
            color: var(--gold);
            font-size: 1rem;
            font-weight: 800;
            margin: 0 0 1rem 0;
        }

        input, textarea, select {
            width: 100%;
            background: var(--bg-dark);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 0.8rem;
            box-sizing: border-box;
            font-family: inherit;
        }

        .btn-submit {
            background: var(--gold);
            color: var(--bg-dark);
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
        }

        .thread-card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--gold);
        }

        .thread-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .thread-title {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 0.5rem 0;
        }

        .thread-text {
            font-size: 0.88rem;
            color: #cbd5e1;
            margin-bottom: 0.8rem;
            line-height: 1.4;
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 1rem;
        }
    </style>
</head>
<body>

    <header class="mobile-header">
        <div class="brand-container">
            <div class="brand-logo">
                <span class="logo-badge">⚽ ARC</span>
                <span class="logo-text">A RAS DE CALLE</span>
            </div>
        </div>
        <nav class="nav-scroll">
            <a href="index.html" class="nav-pill">Inicio</a>
            <a href="partido.html" class="nav-pill">Resultados</a>
            <a href="estadisticas.html" class="nav-pill">Clasificaciones</a>
            <a href="competiciones.html" class="nav-pill">Categorías</a>
            <a href="foro.html" class="nav-pill active">Foro</a>
            <a href="equipos.html" class="nav-pill">Equipos</a>
            <a href="noticias.html" class="nav-pill">Noticias</a>
            <a href="proyecto.html" class="nav-pill">El Proyecto</a>
        </nav>
    </header>

    <main class="container">
        <!-- Formulario para publicar nuevo tema -->
        <div class="forum-form">
            <h3 class="form-title">💬 Crear nuevo debate</h3>
            <input type="text" id="authorInput" placeholder="Tu nombre o usuario...">
            <select id="categoryInput">
                <option value="3ª RFEF">3ª RFEF</option>
                <option value="División de Honor">División de Honor</option>
                <option value="1ª Andaluza">1ª Andaluza</option>
                <option value="2ª Andaluza">2ª Andaluza</option>
            </select>
            <input type="text" id="titleInput" placeholder="Título del tema...">
            <textarea id="messageInput" rows="3" placeholder="Escribe tu mensaje..."></textarea>
            <button class="btn-submit" id="submitBtn">Publicar en el Foro</button>
        </div>

        <!-- Lista de Debates en Directo -->
        <div id="forumThreads">
            <div class="loading-text">Cargando debates en directo...</div>
        </div>
    </main>

   <!-- Importar Firebase SDK y lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxV8DvFapxP3Q3x-xR7q-bOoJSh2c8Iss",
            authDomain: "a-ras-de-calle.firebaseapp.com",
            projectId: "a-ras-de-calle",
            storageBucket: "a-ras-de-calle.firebasestorage.app",
            messagingSenderId: "842000224026",
            appId: "1:842000224026:web:9bdccfad45d002a67026a3",
            measurementId: "G-02ETYTFN8R"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Función para escapar HTML de forma segura
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&")
                .replace(/</g, "<")
                .replace(/>/g, ">")
                .replace(/"/g, """)
                .replace(/'/g, "'");
        }

        // Manejar el clic del botón
        document.getElementById('submitBtn').addEventListener('click', async function() {
            const author = document.getElementById('authorInput').value.trim() || 'Aficionado';
            const cat = document.getElementById('categoryInput').value;
            const title = document.getElementById('titleInput').value.trim();
            const msg = document.getElementById('messageInput').value.trim();

            if (!title || !msg) {
                alert('Por favor, rellena el título y el mensaje.');
                return;
            }

            try {
                await addDoc(collection(db, "threads"), {
                    author: author,
                    category: cat,
                    title: title,
                    message: msg,
                    createdAt: serverTimestamp()
                });

                document.getElementById('titleInput').value = '';
                document.getElementById('messageInput').value = '';
            } catch (e) {
                console.error("Error al publicar: ", e);
                alert("Hubo un error al publicar el mensaje.");
            }
        });

        // Escuchar cambios en tiempo real desde Firestore
        const q = query(collection(db, "threads"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const threadsContainer = document.getElementById('forumThreads');
            threadsContainer.innerHTML = '';

            if (snapshot.empty) {
                threadsContainer.innerHTML = '<div class="loading-text">No hay debates todavía. ¡Sé el primero en escribir!</div>';
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const threadDiv = document.createElement('div');
                threadDiv.className = 'thread-card';
                threadDiv.innerHTML = `
                    <div class="thread-header">
                        <span><strong>${escapeHtml(data.author)}</strong> en <span style="color:var(--gold);">${escapeHtml(data.category)}</span></span>
                        <span>Reciente</span>
                    </div>
                    <h4 class="thread-title">${escapeHtml(data.title)}</h4>
                    <p class="thread-text">${escapeHtml(data.message)}</p>
                `;
                threadsContainer.appendChild(threadDiv);
            });
        });
    </script>
